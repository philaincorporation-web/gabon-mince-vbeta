<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#133d29" />
    <title>Hors ligne — GabonMICE</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #133d29; --muted: #4b5563; --sun: #f28c28; }
      @media (prefers-color-scheme: dark) { :root { --bg: #020617; --ink: #ffffff; --muted: #cbd5e1; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 420px; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      button {
        margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
        background: var(--sun); color: #fff; font: 600 0.95rem system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="GabonMICE" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Cette page n'est pas disponible sans connexion. Les pages déjà consultées restent
        accessibles. Vérifiez votre réseau puis réessayez.
      </p>
      <p lang="en" style="margin-top: 12px; font-size: 0.875rem">
        You are offline. Pages you already visited remain available.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
